name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0). Leave empty to use version from gradle.properties'
        required: false
        default: ''
      release_title:
        description: 'Release title (e.g. EntityUtils 1.0.0). Leave empty for auto-generated title'
        required: false
        default: ''
      draft:
        description: 'Create as a draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Create as a pre-release'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version & Tag
        id: meta
        run: |
          FILE_VERSION=$(grep "^pluginVersion" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          
          # Tag name determination
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${FILE_VERSION}"
          fi
          
          # Title determination
          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="EntityUtils ${TAG#v}"
          fi
          
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "Resolved Tag: ${TAG}"
          echo "Resolved Title: ${TITLE}"

      - name: Build plugin with Gradle
        run: ./gradlew buildPlugin

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: build/distributions/*.zip
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
